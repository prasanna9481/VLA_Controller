experiment:
  name: baseline
  root_dir: experiments

task:
  instruction: "pick up the green cube"

franka:
  robot_ip: "192.168.103.1"
  joint_lower_limit: [-2.8473, -1.7128, -2.8473, -3.0218, -2.8473, 0.0325, -2.8473]
  joint_upper_limit: [2.8473, 1.7128, 2.8473, -0.1198, 2.8473, 3.7025, 2.8473]
  max_joint_velocity: 0.50
  max_joint_acceleration: 0.70
  max_joint_jerk: 0.70

molmo:
  server_url: "http://127.0.0.1:8000/act"
  max_vla_steps: 100
  actions_per_chunk: 15
  action_rate_hz: 15.0
  max_model_waypoint_delta: 0.60
  max_initial_target_offset: 0.60

pi05:
  server_url: "ws://127.0.0.1:8000"
  max_vla_steps: 100
  actions_per_chunk: 15
  action_rate_hz: 15.0

duet_dino:
  host: 127.0.0.1
  port: 8000
  timeout_seconds: 120
  instruction: goal
  max_steps: 25
  max_translation_per_action: 0.20
  max_rotation_per_action_rad: 0.60
  max_joint_target_delta_rad: 0.70
  max_path_deviation_m: 0.05
  max_path_rotation_deviation_rad: 0.095
  max_trajectory_seconds: 20
  joint_goal_tolerance_rad: 0.01
  settle_time_seconds: 0.15
  motion_timeout_seconds: 25
  save_observations: true

gripper:
  enabled: true
  speed: 90
  force: 20

safety:
  max_action_joint_displacement_rad: 1.0
  max_tracking_error_rad: 2.0
  max_feedback_age_s: 0.05