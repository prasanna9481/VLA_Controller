[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molmoact2-franka"
version = "0.1.0"
description = "MolmoAct2-DROID controller for Franka with ZED cameras and Robotiq 2F-85 gripper"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy==2.5.3",
    "requests==2.34.2",
    "json-numpy==2.1.1",
    "pillow==12.3.0",
    "opencv-python==5.0.0.93",
    "pyserial==3.5",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "franka-desk==0.1.0",
    "franky-control==2.0.0",
    "pylibfranka==0.21.3",
]

[tool.setuptools]
packages = [
    "cameras",
    "gripper",
    "inference",
    "robot",
]